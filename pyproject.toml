[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplob-replication"
version = "0.1.4"
description = "Fidelity audit and reproducibility framework for DeepLOB on FI-2010"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Haoming Zhao"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.5", "build==1.2.2.post1", "matplotlib>=3.8,<4"]
report = ["matplotlib>=3.8"]

[project.scripts]
deeplob-rep = "deeplob_replication.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
required-version = "==0.16.5"
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
