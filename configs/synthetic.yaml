protocol: author_tf1
run_name: synthetic-smoke

# Generate inputs first with:
#   deeplob-rep synthetic --processed-dir data/processed

data:
  dataset: synthetic
  processed_dir: data/processed
  horizons: [10]
  sequence_length: 100
  validation_fraction: 0.2

models:
  names: [linear]

training:
  batch_size: 32
  learning_rate: 0.005
  max_epochs: 2
  patience: 2
  seed: 7
  device: cpu
  deterministic: true

evaluation:
  mc_dropout_repeats: 1
